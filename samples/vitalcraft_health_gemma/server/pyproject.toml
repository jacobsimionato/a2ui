[project]
name = "vitalcraft-server"
version = "0.1.0"
description = "VitalCraft On-Device Health Assistant Server with Gemma and Vertical Format"
requires-python = ">=3.10"
dependencies = [
    "a2ui-agent-sdk",
    "a2ui-core",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0"
]

[tool.uv.sources]
a2ui-agent-sdk = { workspace = true }
a2ui-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
